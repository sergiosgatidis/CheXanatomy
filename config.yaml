# CheXanatomy Paligemma Training Configuration
# This YAML file contains all configuration parameters for training

# Model Configuration
model:
  model_size: 10          # Available: 3, 10, 28 (for 3b, 10b, 28b models)
  input_image_size: 224  # Available: 224, 448, 896
  
# Training Data
data:
  training_data_path: "/mnt/SSD2/CT-RATE/processed/CT_RATE_training_data"
  train_val_split: 0.01  # 1% for validation
  enable_augmentation: true
  max_structures_for_multistructure_tasks: 5  # Maximum structures for multi-structure tasks
  
  # Available task types for training (comment out with # to disable)
  available_tasks:
    - "detection"
    - "segmentation"
    - "multi_structure_detection"      # New: detect multiple structures at once
    - "multi_structure_segmentation"   # New: segment multiple structures at once
    - "bbox_token_identification"
    - "mask_token_identification"
    - "bbox_identification"
    - "mask_identification"
    - "orientation_identification"

# Training Hyperparameters
training:
  num_train_epochs: 20
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  weight_decay: 0.01
  adam_beta2: 0.999
  warmup_steps: 2

# Logging and Saving
logging:
  logging_steps: 100
  save_steps: 10000
  eval_steps: 10000
  save_total_limit: 3
  run_name: "chexanatomy_paligemma_testrun_10B"

# Optimization Strategy
optimization:
  use_lora: true
  use_qlora: false
  freeze_vision: true
  lora_r: 16
  lora_target_modules:
    - "q_proj"
    - "o_proj" 
    - "k_proj"
    - "v_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Paths
paths:
  model_output_dir: "/mnt/SSD2/Paligemma_models"
  vqvae_model_path: "./models/vae-oid.npz"

# Wandb Configuration
wandb:
  project: "cheXanatomy"
  entity: "sergiosgatidis"
  tags: 
    - "paligemma"
    - "chest-xray"
    - "anatomy"
    - "vision-language"
    - "medical-ai"
  notes: "Paligemma fine-tuning on chest X-ray anatomy detection and segmentation using CT-RATE dataset"
  
  # Logging configuration
  log_model: true          # Save model checkpoints to wandb
  log_freq: 50            # Log metrics every N steps
  save_code: true         # Save training script to wandb